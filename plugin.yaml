id: printwatch
name: PrintWatch
version: 0.2.0
description: >
  Control and monitor 3D printers through your Hermes agent. Two protocol
  families: Klipper/Moonraker printers over HTTP, and stock-firmware Anycubic
  Kobra printers over LAN Mode (handshake + MQTT — no cloud, no rooting).
  Multi-printer: ask for one printer or a summary table of all. File listing,
  print start/cancel/pause, with file upload + camera snapshots planned.
category: tools
entrypoint: __init__.py
requires_env:
  - name: PRINTWATCH_PRINTERS
    description: >
      JSON map of Anycubic LAN printers, e.g.
      '{"kobra-1": {"host": "192.168.50.215"}}'
    required: false
  - name: PRINTWATCH_MOONRAKER_URL
    description: Base URL of a Moonraker API (e.g. http://192.168.50.60:7125) for Klipper printers
    required: false
  - name: PRINTWATCH_MOONRAKER_API_KEY
    description: Moonraker one-shot access token, if your instance requires one
    required: false
dependencies: requirements.txt
permissions:
  network: local-only
  notes: >
    Talks only to user-configured printer endpoints on the LAN. No external
    services, no telemetry, no credentials stored. Printer session tokens are
    per-session, in-memory only, and never logged.
provides_tools:
  - printer_status
  - printer_files
  - printer_print
  - printer_cancel
  - printer_pause_resume
  - printer_snapshot
