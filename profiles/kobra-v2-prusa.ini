# PrintWatch Kobra 3 V2 profile — converted from Anycubic Slicer Next export
# (tahkingle/AnycubicKobra3v2PrusaProfile) + OrcaSlicer official V2 profiles (PR #15229)
bed_shape = 0x0,255x0,255x255,0x255
max_print_height = 260
nozzle_diameter = 0.4
gcode_flavor = klipper
start_gcode = G9111 bedTemp=[first_layer_bed_temperature] extruderTemp=[first_layer_temperature[initial_tool]]\nM117\nM900 K0.051\n; print_bed_min = {print_bed_min[0]},{print_bed_min[1]}\n; print_bed_max = {print_bed_max[0]},{print_bed_max[1]}\n; print_bed_size = {print_bed_size[0]},{print_bed_size[1]}\n; first_layer_print_min = {first_layer_print_min[0]},{first_layer_print_min[1]}\n; first_layer_print_max = {first_layer_print_max[0]},{first_layer_print_max[1]}\n; first_layer_print_size = {first_layer_print_size[0]},{first_layer_print_size[1]}
end_gcode = M400\nG92 E0 ; zero the extruder\nG1 E-2 F3600\n{if max_layer_z < max_print_height-1}G1 Z{max_layer_z+2} F900 ; Move print head further up{endif}\nG1 X250 Y220 F12000 ; present print\nM140 S0 ; turn off heatbed\nM104 S0 ; turn off temperature\nM107;turn off fan\nM84; disable motors\n; disable stepper motors
before_layer_gcode = ; BEFORE_LAYER_CHANGE [layer_num] @ [layer_z]mm
layer_gcode = ; AFTER_LAYER_CHANGE [layer_num] @ [layer_z]mm
max_layer_height = 0.28
min_layer_height = 0.08
machine_max_acceleration_e = 20000
machine_max_acceleration_extruding = 20000
machine_max_acceleration_retracting = 20000
machine_max_acceleration_x = 20000
machine_max_acceleration_y = 20000
machine_max_acceleration_z = 3000
machine_max_feedrate_x = 600
machine_max_feedrate_y = 600
machine_max_feedrate_z = 20
machine_max_feedrate_e = 600
machine_max_jerk_x = 20
machine_max_jerk_y = 20
machine_max_jerk_z = 20
machine_max_jerk_e = 20
retract_length = 1
retract_speed = 60
deretract_speed = 60
retract_minimum_travel = 1
wipe = 1
use_relative_e_distances = 1
use_firmware_retraction = 0
filament_diameter = 1.75
temperature = 210
first_layer_temperature = 220
bed_temperature = 60
first_layer_bed_temperature = 60
fan_always_on = 1
filament_max_volumetric_speed = 12
layer_height = 0.2
perimeters = 2
top_solid_layers = 5
bottom_solid_layers = 3
fill_density = 15%
fill_pattern = 3dhoneycomb
perimeter_speed = 200
external_perimeter_speed = 130
infill_speed = 300
top_solid_infill_speed = 130
travel_speed = 350
first_layer_speed = 45
first_layer_height = 0.2
support_material = 0
skirts = 1
brim_width = 5
extrusion_width = 0.42
